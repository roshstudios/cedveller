openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /bootstrap:
    get:
      operationId: getBootstrap
      responses:
        "200":
          description: Initial schedule and week information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }
  /schedules:
    get:
      operationId: listMySchedules
      responses:
        "200":
          description: This device's saved schedules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Schedule" }
    post:
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
  /schedules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSchedule
      responses:
        "200":
          description: Public or owned schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
    put:
      operationId: updateSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
    delete:
      operationId: deleteSchedule
      responses:
        "204": { description: Deleted }
  /directory:
    get:
      operationId: listPublicSchedules
      parameters:
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Opted-in public schedules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Schedule" }
  /parse:
    post:
      operationId: parseTimetable
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimetableInput" }
      responses:
        "200":
          description: Unconfirmed extraction requiring review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extraction" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Lesson:
      type: object
      required: [id, day, start, end, name, room, teacher, week, type, note]
      properties:
        id: { type: string }
        day: { type: integer, minimum: 1, maximum: 7 }
        start: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
        end: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        room: { type: string, maxLength: 100 }
        teacher: { type: string, maxLength: 200 }
        week: { type: string, enum: [all, upper, lower] }
        type: { type: string, enum: [lecture, seminar, lab] }
        note: { type: string, maxLength: 500 }
    ScheduleInput:
      type: object
      required: [name, group, isPublic, anchorDate, anchorWeek, lessons]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        group: { type: string, minLength: 1, maxLength: 40 }
        isPublic: { type: boolean }
        anchorDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        anchorWeek: { type: string, enum: [lower, upper] }
        lessons:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Lesson" }
    Schedule:
      allOf:
        - { $ref: "#/components/schemas/ScheduleInput" }
        - type: object
          required: [id, updatedAt, owned]
          properties:
            id: { type: string }
            updatedAt: { type: string }
            owned: { type: boolean }
    Bootstrap:
      type: object
      required: [template, currentWeek, today, timezone, sourceName, warnings]
      properties:
        template: { $ref: "#/components/schemas/Schedule" }
        currentWeek: { type: string, enum: [lower, upper] }
        today: { type: string }
        timezone: { type: string }
        sourceName: { type: string }
        warnings:
          type: array
          items: { type: string }
    TimetableInput:
      type: object
      required: [group, fileName, images]
      properties:
        group: { type: string, minLength: 1, maxLength: 40 }
        fileName: { type: string, maxLength: 200 }
        images:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 4000000 }
        text: { type: string, maxLength: 100000 }
        clarification: { type: string, maxLength: 4000 }
    Extraction:
      type: object
      required: [lessons, warnings, questions, sourceName]
      properties:
        lessons:
          type: array
          items: { $ref: "#/components/schemas/Lesson" }
        warnings:
          type: array
          items: { type: string }
        questions:
          type: array
          items: { type: string }
        sourceName: { type: string }
