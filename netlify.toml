[build]
  command = "pnpm run typecheck:libs && pnpm --filter @workspace/ders-takvimim run build"
  publish = "artifacts/ders-takvimim/dist/public"
  functions = "artifacts/api-server/netlify"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10.26.1"
  BASE_PATH = "/"
  PORT = "5173"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
